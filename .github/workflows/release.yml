name: Release

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  draft-release:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main
          fetch-depth: 0

      - name: Skip if draft release already exists for HEAD
        id: existing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHA=$(git rev-parse HEAD)
          COUNT=$(gh release list --limit 100 --json isDraft,targetCommitish --jq --arg sha "$SHA" '[.[] | select(.isDraft == true and .targetCommitish == $sha)] | length')
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        if: steps.existing.outputs.count == '0'
        with:
          node-version: lts/*

      - uses: pnpm/action-setup@v4
        if: steps.existing.outputs.count == '0'

      - run: pnpm install --frozen-lockfile
        if: steps.existing.outputs.count == '0'

      - name: Bump patch version
        if: steps.existing.outputs.count == '0'
        id: version
        run: |
          npm version patch --no-git-tag-version
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "name=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Commit version bump
        if: steps.existing.outputs.count == '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json pnpm-lock.yaml
          git commit -m "chore: bump version to v${{ steps.version.outputs.version }}"
          git push

      - name: Create draft GitHub Release
        if: steps.existing.outputs.count == '0'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: main
          name: ${{ steps.version.outputs.name }}
          draft: true
          prerelease: false
          generate_release_notes: true
