name: Deploy Mainnet

on:
  release:
    types: [published]

permissions:
  contents: read
  deployments: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run type-check
      - run: pnpm run test

  deploy-mainnet:
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: mainnet
      url: https://staking.burnt.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - name: Build mainnet app
        run: pnpm run build
        env:
          NEXT_PUBLIC_CHAIN_ID: "xion-mainnet-1"
      - name: Deploy mainnet to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.BURNT_CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.BURNT_CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --env mainnet
          packageManager: pnpm
