name: Deploy Testnet

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run type-check
      - run: pnpm run test

  deploy-testnet:
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: testnet
      url: https://staking.testnet.burnt.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - name: Build testnet app
        run: pnpm run build
        env:
          NEXT_PUBLIC_CHAIN_ID: "xion-testnet-2"
      - name: Deploy testnet to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.BURNT_CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.BURNT_CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --env testnet
          packageManager: pnpm
